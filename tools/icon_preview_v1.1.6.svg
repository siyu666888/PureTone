<svg xmlns="http://www.w3.org/2000/svg" width="620" height="380" viewBox="0 0 620 380">
  <rect width="620" height="380" fill="#fafafa"/>
  <text x="20" y="34" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222">PureTone 播放控制图标 · v1.1.6（忠实等宽线形）</text>
  <text x="20" y="52" font-family="sans-serif" font-size="12" fill="#888">线性等宽 · 圆角端点 · 中性色由 Icon(tint) 着色 · 视口 28×28</text>

  <!-- 上一首 -->
  <g transform="translate(36.8,76.8) scale(3.8)" stroke="#222" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 8.5 14 L 13 5.5 L 13 22.5 M 15.5 14 L 20 5.5 L 20 22.5"/>
  </g>
  <text x="90" y="210" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">上一首</text>

  <!-- 下一首 -->
  <g transform="translate(186.8,76.8) scale(3.8)" stroke="#222" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 19.5 14 L 15 5.5 L 15 22.5 M 12.5 14 L 8 5.5 L 8 22.5"/>
  </g>
  <text x="240" y="210" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">下一首</text>

  <!-- 播放 -->
  <g transform="translate(336.8,76.8) scale(3.8)" fill="#222" stroke="#222" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 9 8 L 20 14 L 9 20 Z"/>
  </g>
  <text x="390" y="210" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">播放</text>

  <!-- 暂停 -->
  <g transform="translate(486.8,76.8) scale(3.8)" stroke="#222" stroke-width="4.2" stroke-linecap="round" fill="none">
    <path d="M 10.4 5.5 L 10.4 22.5 M 17.6 5.5 L 17.6 22.5"/>
  </g>
  <text x="540" y="210" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">暂停</text>

  <!-- 播放队列 -->
  <g transform="translate(36.8,226.8) scale(3.8)" stroke="#222" stroke-width="2.4" stroke-linecap="round" fill="none">
    <path d="M 6.5 9 L 15.5 9 M 6.5 14 L 15.5 14 M 6.5 19 L 15.5 19"/>
  </g>
  <g transform="translate(36.8,226.8) scale(3.8)" fill="#222">
    <circle cx="20" cy="9.5" r="2.2"/>
    <circle cx="20" cy="18.5" r="2.2"/>
  </g>
  <text x="90" y="360" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">播放队列</text>

  <!-- 顺序循环 -->
  <g transform="translate(186.8,226.8) scale(3.8)" stroke="#222" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 19.09 8.91 A 7.2 7.2 0 0 1 9.87 19.9 M 10.9 22.72 L 9.87 19.9 L 12.87 19.9 M 8.91 19.09 A 7.2 7.2 0 0 1 18.13 8.1 M 17.1 5.28 L 18.13 8.1 L 15.13 8.1"/>
  </g>
  <text x="240" y="360" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">顺序循环</text>

  <!-- 单曲循环 -->
  <g transform="translate(336.8,226.8) scale(3.8)" stroke="#222" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 19.09 8.91 A 7.2 7.2 0 0 1 9.87 19.9 M 10.9 22.72 L 9.87 19.9 L 12.87 19.9 M 8.91 19.09 A 7.2 7.2 0 0 1 18.13 8.1 M 17.1 5.28 L 18.13 8.1 L 15.13 8.1 M 14 10.5 L 14 17.5 M 11.4 12 L 14 10.5"/>
  </g>
  <text x="390" y="360" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">单曲循环</text>

  <!-- 随机播放 -->
  <g transform="translate(486.8,226.8) scale(3.8)" stroke="#222" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 5 10 L 10 10 L 17 18 L 22 18 M 5 18 L 10 18 L 17 10 L 22 10 M 19.71 8.39 L 22 10 L 19.71 11.61 M 19.71 16.39 L 22 18 L 19.71 19.61"/>
  </g>
  <text x="540" y="360" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">随机播放</text>
</svg>
