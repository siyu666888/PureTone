org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Room 2.7.0 + Hilt 2.56.2 已修复 KSP2 兼容（unexpected jvm signature V / Cannot find setter for field），启用 KSP2
ksp.useKSP2=true
# AGP 9 收紧 SourceSet API：不再允许向 assets.srcDir 传 Provider（buildDirectory.dir 返回 Provider）。
# 本项目在 app/build.gradle.kts 用 Provider 把 ffmpeg-license 提取目录挂进 assets，
# 临时放开该限制作为 AGP 9 迁移桥接；后续应改用 Variant API 的 addGeneratedDirectory。
android.sourceset.disallowProvider=false
# AGP 9 内置 Kotlin 禁止用 kotlin.sourceSets 加源（KSP 为 benchmark buildType 生成的源码走此路径）。
# 临时放开该限制作为 AGP 9 迁移桥接；后续应改用 android.sourceSets / Variant API。
android.disallowKotlinSourceSets=false
# AGP 9 切换到新 DSL 后移除了 baselineprofile(< 1.5.0-alpha01) 依赖的 TestExtension。
# baselineprofile 1.4.1 仍走旧 DSL，需回退 newDsl 作为 AGP 9 迁移桥接（10.0 移除该开关）。
android.newDsl=false
