name: Android CI

# PureTone CI：push / PR 自动验证，替代「改完手工跑一遍」。
#
# 三个环节：
#   ① 单元测试（Robolectric）  ② Debug 包构建  ③ Release 包构建 + 签名校验
#
# 关于 Release 签名：
#   真实 keystore 未入库（.gitignore 已排除 local.properties 与 *.jks）。
#   推荐做法：用 scripts/backup-keystore.sh 生成密钥库 base64，存入仓库 Secrets
#   (SIGNING_KEY)，由 CI 在「还原签名密钥」步骤从 Secrets 还原正式签名。
#   未配置 Secrets 时（如外部 fork 的 PR 无权访问 Secrets），CI 自动回退到一次性
#   临时密钥，仅用于验证 release 链路（R8/proguard 保留规则）能编通，不用于正式发布。

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: 构建与测试
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 设置 JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest 镜像已预装 Android SDK（ANDROID_HOME=/usr/local/lib/android/sdk），
      # 无需 android-actions/setup-android（其新版会安装已废弃的 tools 包而失败），
      # 只需用预装的 sdkmanager 补齐本项目需要的组件并接受许可。
      - name: 安装 SDK 组件并接受许可
        run: |
          SDKM="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      # 文件行数门禁：卡住「下一个 1000+ 行文件」。
      # 放在最前面，因为它是纯文本检查、毫秒级完成——让结构性问题
      # 在跑完整个 Gradle 构建之前就暴露出来，不浪费 CI 分钟数。
      # 详细设计见 scripts/check-file-size.sh 顶部注释。
      - name: 文件行数门禁 (上限 1200 行)
        run: bash scripts/check-file-size.sh

      - name: 缓存 Gradle 依赖
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: 运行单元测试 (Robolectric)
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: 构建 Debug APK
        run: ./gradlew assembleDebug --no-daemon

      # Release 签名：优先用仓库 Secrets 中的正式 keystore；
      # 缺失时（如外部 fork 的 PR 无 Secrets 访问权）回退到一次性临时密钥，保证 CI 仍可编通。
      # 需在仓库 Settings → Secrets and variables → Actions 配置：
      #   SIGNING_KEY        = base64(app/keystore/puretone-release.jks)（由 scripts/backup-keystore.sh 生成）
      #   KEY_STORE_PASSWORD = storePassword
      #   KEY_PASSWORD       = keyPassword
      #   KEY_ALIAS          = puretone
      - name: 还原签名密钥 (Secrets 优先)
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "使用 Secrets 中的正式签名密钥"
            echo "$SIGNING_KEY" | base64 -d > "${{ github.workspace }}/release-keystore.jks"
            STORE_FILE="${{ github.workspace }}/release-keystore.jks"
            ALIAS="${KEY_ALIAS:-puretone}"
            SP="$KEY_STORE_PASSWORD"
            KP="$KEY_PASSWORD"
          else
            echo "SIGNING_KEY 未配置，回退到 CI 临时密钥（仅验证 release 链路，非正式签名）"
            keytool -genkeypair -v \
              -keystore "${{ github.workspace }}/ci-release.jks" \
              -storetype PKCS12 -keyalg RSA -keysize 2048 -validity 10000 \
              -alias puretone -storepass android -keypass android \
              -dname "CN=CI, OU=CI, O=CI, L=CI, S=CI, C=CN"
            STORE_FILE="${{ github.workspace }}/ci-release.jks"
            ALIAS="puretone"
            SP="android"
            KP="android"
          fi
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "storeFile=$STORE_FILE"
            echo "storePassword=$SP"
            echo "keyAlias=$ALIAS"
            echo "keyPassword=$KP"
          } > local.properties
          echo "--- local.properties (口令已隐去) ---"
          sed -E 's/(Password=).*/\1<redacted>/' local.properties

      - name: 构建 Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: 校验 Release 签名 (apksigner)
        # apksigner 一次只接受一个 APK；本项目按 ABI 拆分出多个包，需逐个校验，
        # 任一个失败即整体失败（否则签名问题会被静默放过）。
        run: |
          set -e
          # 动态定位，避免 build-tools 版本号硬编码在 runner 镜像升级后失效
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | head -1)
          echo "using apksigner: $APKSIGNER"
          for apk in app/build/outputs/apk/release/*.apk; do
            echo "==> verifying $apk"
            "$APKSIGNER" verify --verbose "$apk"
          done

      # LGPL 合规断言（P0-3）：
      # release 开启 shrinkResources 会删掉「无代码引用」的 raw 资源，
      # 实测曾导致 ffmpeg-kit 的 LGPL 许可证全文与**源码获取方式**被裁掉——
      # 发布出去的 APK 既无许可证全文也无 source.txt，合规实际未闭环
      # （且 packaging.pickFirsts 里的 META-INF/NOTICE / LGPL2.1 对本 AAR 无效，
      #   因为 AAR 内根本没有这些条目）。
      # 现改为从 AAR 提取到 assets/licenses/（assets 不参与资源裁剪），
      # 这里断言它们确实在包里，防止回归。
      - name: 校验 LGPL 许可证随包分发
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/release/*universal-release.apk | head -1)
          for f in assets/licenses/license.txt assets/licenses/source.txt; do
            if unzip -l "$APK" | grep -q "$f"; then
              echo "$f OK"
            else
              echo "::error::$f 缺失——LGPL 许可证/源码获取方式未随包分发"
              exit 1
            fi
          done

      - name: 校验 Baseline Profile 已打包
        # 手写规则（app/src/main/baselineProfiles/baseline-prof.txt）若被误删或
        # 写了 dex 中不存在的类，AGP 会静默跳过或构建失败。这里断言产物里确实
        # 带 assets/dexopt/baseline.prof，避免性能回归无人察觉。
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/release/*universal-release.apk | head -1)
          echo "checking $APK"
          unzip -l "$APK" | grep -q "assets/dexopt/baseline.prof" \
            && echo "baseline.prof OK" \
            || { echo "::error::assets/dexopt/baseline.prof 缺失"; exit 1; }

      # 16KB 页大小兼容性（P0-3 第一步实测结论，详见 dist/v1.7.24 交付文档）。
      #
      # 实测结论：ffmpeg-kit 6.0-2.LTS 的全部 .so 是 **4KB 页**编译
      # （PT_LOAD p_align=4096），在 16KB 页设备上无法加载；
      # 而 APK 内 .so 全部为 Stored（未压缩），故 zip 条目层**必须**16KB 对齐。
      #
      # 两层实测结果：
      #   ZIP  层（zipalign -c -P 16）→ 5 个 APK 全部 EXIT=0，零不对齐条目
      #                            （AGP 8.6 打包已正确处理）
      #   ELF 层（PT_LOAD p_align）  → 52 个 .so 中 44 个不合规，全为 ffmpeg-kit 系
      #
      # 为什么现在**不**阻塞：Google Play 的 16KB 硬要求绑定 targetSdk 35+，
      # 本项目当前 targetSdk=34，尚未触发。强行阻塞只会让 CI 永久变红、
      # 掩盖其它真实失败。
      # 升级为真门禁的时机：ffmpeg-kit 换成 16KB 构建之后——
      # 届时删掉本步的 continue-on-error: true 即可。
      - name: 检查 16KB 页大小对齐（当前已知不合规，仅报告不阻塞）
        continue-on-error: true
        run: |
          set -e
          # 只查 universal 包：它一个就覆盖 arm64-v8a / armeabi-v7a / x86 / x86_64 四个 ABI
          APK=$(ls app/build/outputs/apk/release/*universal-release.apk | head -1)
          echo "checking $APK"
          python3 tools/check_16kb_alignment.py "$APK" > /tmp/16kb.txt 2>&1 || true
          cat /tmp/16kb.txt
          {
            echo "### 16KB 页大小对齐检查（ELF LOAD 段）"
            echo ""
            echo '```'
            cat /tmp/16kb.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Baseline Profile 有效性校验（P2-1）：
      # 「打包了」不等于「生效」——规则里若写了 dex 中不存在的类，AGP 会静默丢弃，
      # profile 看着存在、实际不生效。这里断言每条类级规则都能在 dex 中找到。
      - name: 校验 Baseline Profile 规则有效性
        run: |
          set -e
          ./gradlew :app:assembleDebug --no-daemon
          bash scripts/verify-baseline-profile.sh

      # P2-1：benchmark 模块（Baseline Profile 采集器）必须能编译，
      # 否则采集链路会腐化——而它腐化时不会有任何告警（CI 不跑采集）。
      # 这里只保证「代码能编译」，采集本身需真机，在 CI 之外由
      # scripts/collect-baseline-profile.sh 执行。
      - name: 构建 Baseline Profile 采集模块
        run: ./gradlew :benchmark:assembleBenchmark --no-daemon

      # lint 现在是真门禁：存量告警已冻结在 app/lint-baseline.xml（入库，本地与 CI 共用），
      # 只有新增告警才会让这一步失败。已用一个临时探针（故意 Toast 不 show）验证过
      # 闸门确实会拦，不是形同虚设。
      - name: 静态检查 (lint，新增告警即失败)
        run: ./gradlew lintDebug --no-daemon

      # detekt 门禁：管 Kotlin 侧的**结构与复杂度**（lint 管 Android 特有正确性）。
      # 存量冻结在 app/detekt-baseline.xml，配置见 config/detekt/detekt.yml。
      # 探针实测：加一个未使用导入 → detekt 失败（Analysis failed with 1 weighted issues）。
      # 同时扫 benchmark 模块（P2-1 的采集器代码也在门禁范围内）。
      - name: 静态检查 (detekt，新增问题即失败)
        run: ./gradlew :app:detekt :benchmark:detekt --no-daemon

      - name: 上传 APK 产物
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: 上传 lint 报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
